<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1D2D45"/><stop offset="1" stop-color="#0F1725"/></linearGradient></defs>
  <rect x="2" y="2" width="996" height="516" rx="28" fill="url(#bg)" stroke="#2A3D57" stroke-width="3"/>
  <text x="40" y="58" font-size="24" font-weight="700" fill="#E6EEF5">FTP upload speed, PC → Xbox</text>
  <text x="40" y="86" font-size="16" fill="#8FA6BA">Same console · MiB/s, higher is faster</text>
  <!-- scale: x0=360, 0..60 MiB/s -> 0..560px -->
  <g stroke="#2A3D57" stroke-width="1">
    <line x1="360.0" y1="112" x2="360.0" y2="472"/>
    <line x1="453.3" y1="112" x2="453.3" y2="472"/>
    <line x1="546.7" y1="112" x2="546.7" y2="472"/>
    <line x1="640.0" y1="112" x2="640.0" y2="472"/>
    <line x1="733.3" y1="112" x2="733.3" y2="472"/>
    <line x1="826.7" y1="112" x2="826.7" y2="472"/>
    <line x1="920.0" y1="112" x2="920.0" y2="472"/>
  </g>
  <g font-size="13" fill="#8FA6BA" text-anchor="middle">
    <text x="360.0" y="492">0</text>
    <text x="453.3" y="492">10</text>
    <text x="546.7" y="492">20</text>
    <text x="640.0" y="492">30</text>
    <text x="733.3" y="492">40</text>
    <text x="826.7" y="492">50</text>
    <text x="920.0" y="492">60</text>
  </g>
  <line x1="40" y1="316" x2="960" y2="316" stroke="#2A3D57" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="40" y="340" font-size="14" font-weight="600" fill="#8FA6BA">For comparison: Xbox drives</text>
  <text x="340" y="150" text-anchor="end" font-size="17" font-weight="600" fill="#E6EEF5">Normal FTP</text>
  <text x="340" y="170" text-anchor="end" font-size="13" fill="#8FA6BA">Xbox&#39;s own 100 Mbit port, max</text>
  <path d="M360 140 H454.0 a4 4 0 0 1 4 4 V160 a4 4 0 0 1 -4 4 H360 Z" fill="#3A4A5E"/>
  <text x="470.0" y="158" font-size="17" font-weight="700" fill="#E6EEF5">10.5</text>
  <text x="340" y="214" text-anchor="end" font-size="17" font-weight="600" fill="#E6EEF5">Aurora&#39;s built-in FTP</text>
  <text x="340" y="234" text-anchor="end" font-size="13" fill="#8FA6BA">USB adapter, CUsbEnet</text>
  <path d="M360 204 H538.0 a4 4 0 0 1 4 4 V224 a4 4 0 0 1 -4 4 H360 Z" fill="#5B6B80"/>
  <text x="554.0" y="222" font-size="17" font-weight="700" fill="#E6EEF5">19.5</text>
  <text x="340" y="278" text-anchor="end" font-size="17" font-weight="600" fill="#E6EEF5">FastFTP</text>
  <text x="340" y="298" text-anchor="end" font-size="13" fill="#8FA6BA">USB adapter, CUsbEnet 1.1 acksmall</text>
  <path d="M360 268 H617.3 a4 4 0 0 1 4 4 V288 a4 4 0 0 1 -4 4 H360 Z" fill="#3ED9BC"/>
  <text x="633.3" y="286" font-size="17" font-weight="700" fill="#E6EEF5">28</text>
  <text x="340" y="374" text-anchor="end" font-size="17" font-weight="600" fill="#E6EEF5">DVD drive</text>
  <text x="340" y="394" text-anchor="end" font-size="13" fill="#8FA6BA">12x rated max, outer edge</text>
  <path d="M360 365 H504.4 a3 3 0 0 1 3 3 V384 a3 3 0 0 1 -3 3 H360 Z" fill="#8FA6BA" fill-opacity="0.12" stroke="#8FA6BA" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="520.4" y="382" font-size="17" font-weight="700" fill="#E6EEF5">15.9</text>
  <text x="340" y="438" text-anchor="end" font-size="17" font-weight="600" fill="#E6EEF5">Internal hard drive</text>
  <text x="340" y="458" text-anchor="end" font-size="13" fill="#8FA6BA">Measured write speed</text>
  <path d="M360 429 H892.7 a3 3 0 0 1 3 3 V448 a3 3 0 0 1 -3 3 H360 Z" fill="#8FA6BA" fill-opacity="0.12" stroke="#8FA6BA" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="908.7" y="446" font-size="17" font-weight="700" fill="#E6EEF5">57.5</text>
</svg>
